name: auto-notelemetry
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 重新构建已处理过的版本
        type: boolean
        default: false
      tag:
        description: 指定要构建的版本号
        type: string
        default: ""
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 一个接一个跑：先正式版，后每夜版。GitHub 大致按创建先后排列，后建的在前，
      # 这样每夜版会排在正式版上面，和官方一致
      max-parallel: 1
      matrix:
        # 指定了版本号就只构建这一个版本；留空时构建最新正式版和每夜版
        channel: ${{ fromJSON(inputs.tag && '["stable"]' || '["stable","nightly"]') }}
    steps:
      - name: 查找官方最新包
        id: up
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # 只从原仓库取：https://github.com/Fanju6/NetProxy-Magisk/releases
          repo=Fanju6/NetProxy-Magisk
          if [ -n "$INPUT_TAG" ]; then
            tag="$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')"
            case "$tag" in [0-9]*) tag="v$tag" ;; esac
            printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._+-]+$' \
              || { echo "版本号格式不对: $tag（应为 v8.6.2 这样的写法）"; exit 1; }
            echo "手动指定版本: $tag"
          elif [ "${{ matrix.channel }}" = nightly ]; then
            tag=nightly
          else
            tag=$(gh release list --repo "$repo" --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          fi
          [ -n "$tag" ] || { echo "原仓库没有找到 ${{ matrix.channel }} 的 release"; exit 1; }
          echo "官方版本: $tag"
          # 安装包形如 NetProxy_v8.6.2_1090.zip
          gh release download "$tag" --repo "$repo" --pattern 'NetProxy_*.zip' --dir official \
            || { echo "原仓库 $tag 里没有 NetProxy_*.zip"; exit 1; }
          ls -la official
          # 顺便取官方 release 的标题和更新日志，发布时附上
          gh release view "$tag" --repo "$repo" --json body -q .body > official_notes.md || true
          gh release view "$tag" --repo "$repo" --json name -q .name > official_title.txt || true
          gh release view "$tag" --repo "$repo" --json publishedAt -q .publishedAt > official_date.txt || true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 从官方包里读出源码提交号
        id: commit
        run: |
          cat > pkg.py <<'PY'
          import zipfile, struct, lzma
          def read_entry(path, name):
              z = zipfile.ZipFile(path); fh = open(path, 'rb')
              i = z.getinfo(name)
              if i.compress_type in (0, 8): return z.read(i)
              if i.compress_type == 95:
                  fh.seek(i.header_offset); h = fh.read(30)
                  n, e = struct.unpack('<HH', h[26:30])
                  fh.seek(i.header_offset + 30 + n + e)
                  return lzma.decompress(fh.read(i.compress_size))
              raise SystemExit('不支持的压缩方式 %d' % i.compress_type)
          PY
          python3 - <<'PY'
          import re, glob, io, zipfile
          from pkg import read_entry
          official = glob.glob('official/NetProxy_*.zip')[0]
          apk = zipfile.ZipFile(io.BytesIO(read_entry(official, 'NetProxy.apk')))
          manifest = apk.read('AndroidManifest.xml')
          m = re.search(rb'ci\.([0-9a-f]{7,40})', manifest) or re.search(rb'c\x00i\x00\.\x00((?:[0-9a-f]\x00){7,40})', manifest)
          if not m: raise SystemExit('官方 APK 的 versionName 里没有提交号')
          sha = m.group(1).replace(b'\x00', b'').decode()
          open('commit.txt', 'w').write(sha)
          print('源码提交:', sha)
          PY
          echo "sha=$(cat commit.txt)" >> "$GITHUB_OUTPUT"

      - name: 判断是否已处理
        id: chk
        run: |
          sha="${{ steps.commit.outputs.sha }}"
          if [ "${{ matrix.channel }}" = nightly ]; then
            name="nightly-${sha:0:7}"
          else
            name="${{ steps.up.outputs.tag }}"
          fi
          # release 的 tag 跟官方一致：正式版是 v8.7.0，每夜版固定是 nightly
          rel="${{ steps.up.outputs.tag }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "rel=$rel" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = true ]; then
            echo "强制重建 $rel"
          elif gh release view "$rel" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 正式版：tag 已存在就算处理过；每夜版：还要看已发布的是不是同一个源码提交
            if [ "${{ matrix.channel }}" != nightly ] \
              || gh release view "$rel" --repo "$GITHUB_REPOSITORY" --json body -q .body | grep -q "$sha"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "已经处理过 $rel"
            fi
          fi

      - name: 下载对应源码
        if: steps.chk.outputs.skip != 'true'
        run: |
          mkdir upstream
          curl -fL --retry 5 -o src.tgz "https://codeload.github.com/Fanju6/NetProxy-Magisk/tar.gz/${{ steps.commit.outputs.sha }}"
          tar -xzf src.tgz -C upstream --strip-components=1

      - uses: actions/setup-go@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          go-version-file: upstream/src/native/netproxy/go.mod

      - name: 删除统计代码
        id: strip
        if: steps.chk.outputs.skip != 'true'
        working-directory: upstream/src/native/netproxy
        run: |
          cat > "$RUNNER_TEMP/strip_telemetry.py" <<'PY'
          #!/usr/bin/env python3
          """删除 NetProxy 源码里的统计代码：telemetry 包及所有调用点。任何一处对不上就报错退出（由调用方回退到空实现）。"""
          import os, re, shutil, sys

          root = sys.argv[1]  # .../src/native/netproxy
          def P(*a): return os.path.join(root, *a)

          def edit(path, subs):
              s = open(path, encoding='utf-8').read()
              for old, new in subs:
                  if s.count(old) != 1:
                      sys.exit(f"对不上: {path}: {old[:60]!r} (出现 {s.count(old)} 次)")
                  s = s.replace(old, new, 1)
              open(path, 'w', encoding='utf-8').write(s)

          # 1. 删掉 telemetry 包
          shutil.rmtree(P('internal', 'telemetry'))

          # 2. app.go
          edit(P('internal', 'module', 'app.go'), [
              ('\t"github.com/Fanju6/NetProxy-Magisk/src/native/netproxy/internal/telemetry"\n', ''),
              ('\tTelemetry          *telemetry.Reporter\n', ''),
              ('\t\tTelemetry:      telemetry.New(layout),\n', ''),
              ('''	if options.Telemetry != nil {
          		workerOptions.Telemetry = options.Telemetry
          		workerOptions.CoreRunning = func() bool {
          			state, err := ReadServiceState(options.StateFile)
          			return err == nil && state.State == "ready" && state.PID > 0 && service.FindProcess(options.SingBoxPath, int(state.PID)) == int(state.PID)
          		}
          	}
          ''', ''),
              ('''// RecordActivity 仅记录公共客户端的活跃；停服入口不能为统计重新启动 Worker。
          func RecordActivity(ctx context.Context, options Options, startWorker bool) {
          	if options.Telemetry == nil || ctx.Err() != nil {
          		return
          	}
          	if added, err := options.Telemetry.RecordActive(time.Now()); added && err == nil {
          		options.Telemetry.Notify()
          		if startWorker {
          			_ = EnsureWorker(ctx, options)
          		}
          	}
          }

          ''', ''),
          ])

          # 3. lifecycle.go
          edit(P('internal', 'module', 'lifecycle.go'), [
              ('''	attemptedAt := time.Now()
          	stage := "launch"
          	defer func() {
          		if ctx.Err() == nil {
          			_ = options.Telemetry.RecordStart(time.Now(), time.Since(attemptedAt), stage, err == nil)
          		}
          	}()
          ''', ''),
          ])
          # stage 变量只用于上报：删掉所有 stage = "..." 赋值
          lp = P('internal', 'module', 'lifecycle.go')
          s = open(lp, encoding='utf-8').read()
          s, n = re.subn(r'(?m)^\tstage = "(?:cgroup|state|ready|mode)"\n', '', s)
          if n != 5: sys.exit(f"对不上: lifecycle.go stage 赋值应有 5 处，实际 {n}")
          if re.search(r'\bstage\b', s.split('func startPreparedService')[1].split('\n}\n')[0]):
              sys.exit("对不上: lifecycle.go 里 stage 还有别的用途")
          open(lp, 'w', encoding='utf-8').write(s)

          # 4. internal_worker.go
          edit(P('cmd', 'netproxyctl', 'internal_worker.go'), [
              ('\t"github.com/Fanju6/NetProxy-Magisk/src/native/netproxy/internal/service"\n', ''),
          ])
          ip = P('cmd', 'netproxyctl', 'internal_worker.go')
          s = open(ip, encoding='utf-8').read()
          m = re.search(r'\tif moduleOptions\.Telemetry != nil \{\n.*?\n\t\}\n', s, re.S)
          if not m or 'FindProcess' not in m.group(0) or m.group(0).count('\n\t}\n') != 1 and False: sys.exit("对不上: internal_worker.go Telemetry 块")
          s = s.replace(m.group(0), '', 1)
          open(ip, 'w', encoding='utf-8').write(s)

          # 5. main.go：不再记录活跃
          edit(P('cmd', 'netproxyctl', 'main.go'), [
              ('''	if status != 2 && !skipActivity(args) {
          		stop := len(args) > 1 && args[0] == "service" && (args[1] == "stop" || args[1] == "toggle")
          		moduleapp.RecordActivity(commandCtx, c.options, !stop)
          	}
          ''', ''),
          ])

          # 6. httpapi/server.go
          edit(P('internal', 'httpapi', 'server.go'), [
              ('''		if pattern != "GET /api/v1/info" && pattern != "POST /api/v1/auth/provision" && !strings.Contains(pattern, "/android/") {
          			moduleapp.RecordActivity(ctx, s.options, false)
          		}
          ''', ''),
          ])

          # 7. worker.go / process.go
          edit(P('internal', 'worker', 'worker.go'), [
              ('''	Telemetry               interface {
          		Run(context.Context, func() bool, func())
          		Notify()
          	}
          ''', ''),
              ('''	var telemetryDone chan struct{}
          	if options.Telemetry != nil {
          		telemetryDone = make(chan struct{})
          		go func() {
          			defer close(telemetryDone)
          			options.Telemetry.Run(background, options.CoreRunning, func() {
          				logWorker(logger, "WARN", "telemetry.upload", "waiting", "设备统计暂未完成，将稍后重试")
          			})
          		}()
          	}
          ''', ''),
              ('''		if telemetryDone != nil {
          			<-telemetryDone
          		}
          ''', ''),
              ('!networkWatchEnabled && options.Telemetry == nil && options.APIConfig', '!networkWatchEnabled && options.APIConfig'),
              ('''				if options.Telemetry != nil {
          					options.Telemetry.Notify()
          				}
          ''', ''),
          ])
          edit(P('internal', 'worker', 'process.go'), [
              ('err != nil && options.Telemetry == nil && options.APIConfig', 'err != nil && options.APIConfig'),
              ('options.NetworkEvaluate != nil) && options.Telemetry == nil && options.APIConfig', 'options.NetworkEvaluate != nil) && options.APIConfig'),
          ])
          edit(P('internal', 'paths', 'paths.go'), [
              ('''// TelemetryState 返回不参与配置编辑与日志导出的设备统计状态。
          func (l Layout) TelemetryState() string { return filepath.Join(l.Config(), "telemetry", "state.json") }

          // TelemetryLock 返回目录热切换期间仍保持同一 inode 的统计锁。
          func (l Layout) TelemetryLock() string { return filepath.Join(l.DevRoot(), "telemetry.lock.flock") }

          ''', ''),
          ])
          print("统计代码已删除")
          PY
          if [ ! -d internal/telemetry ]; then
            echo "::notice::这个版本的源码里没有统计代码，无需删除"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 先留一份原始源码，整体删除编译不过时可以退回
          cp -r . "$RUNNER_TEMP/netproxy.orig"
          if python3 -I "$RUNNER_TEMP/strip_telemetry.py" .; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::整体删除统计代码没对上官方源码，改用空实现"
            rm -rf ./* && cp -r "$RUNNER_TEMP/netproxy.orig/." .
            echo "mode=stub" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译（不注入统计凭据）
        if: steps.chk.outputs.skip != 'true'
        working-directory: upstream/src/native/netproxy
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          build() {
            go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/netproxyctl" ./cmd/netproxyctl \
              || GOEXPERIMENT=jsonv2 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/netproxyctl" ./cmd/netproxyctl
          }
          use_stub() {
            rm -rf ./* && cp -r "$RUNNER_TEMP/netproxy.orig/." .
            f=internal/telemetry/telemetry.go
            [ -f "$f" ] || { echo "找不到 $f，官方可能改了统计代码的位置，需要重新适配"; exit 1; }
            cat > "$f" <<'GO'
          // Package telemetry 是去统计版的空实现：不收集设备信息，不写状态文件，不发起任何网络请求。
          package telemetry

          import (
          	"context"
          	"time"

          	"github.com/Fanju6/NetProxy-Magisk/src/native/netproxy/internal/paths"
          )

          // Reporter 只是占位类型，所有方法都是空操作。
          type Reporter struct{}

          // New 永远返回 nil，调用方对 nil 上报器已做空操作处理。
          func New(paths.Layout) *Reporter { return nil }

          func (r *Reporter) RecordActive(time.Time) (bool, error)                     { return false, nil }
          func (r *Reporter) RecordStart(time.Time, time.Duration, string, bool) error { return nil }
          func (r *Reporter) Notify()                                                  {}
          func (r *Reporter) Run(context.Context, func() bool, func())                 {}
          GO
            rm -f internal/telemetry/*_test.go
            build
          }
          mode="${{ steps.strip.outputs.mode }}"
          if grep -rnIE "phc_[A-Za-z0-9]{20,}" ../../.. | grep -v _test.go; then
            echo "源码里有写死的 key，需要改用方案 B"; exit 1
          fi
          if [ "$mode" = full ]; then
            build || { echo "::warning::整体删除后编译失败，改用空实现"; mode=stub; use_stub; }
          elif [ "$mode" = stub ]; then
            use_stub
          else
            build
          fi
          echo "统计代码处理方式: $mode"
          BIN="$RUNNER_TEMP/netproxyctl"
          if grep -a -q -i -E "posthog|phc_[A-Za-z0-9]{20,}" "$BIN"; then
            echo "产物里仍有统计地址或 key"; exit 1
          fi
          if grep -a -q -E "telemetry\.(readDeviceID|hashDeviceID|readCompatibility|newUploadClient)" "$BIN"; then
            echo "产物里仍有设备信息收集或上传代码"; exit 1
          fi
          if [ "$mode" = full ] && grep -a -q -E "internal/telemetry|telemetry\.upload|telemetry\.lock" "$BIN"; then
            echo "产物里仍有统计相关残留"; exit 1
          fi

      - name: 替换并发布
        if: steps.chk.outputs.skip != 'true'
        run: |
          NAME="${{ steps.chk.outputs.name }}"
          REL="${{ steps.chk.outputs.rel }}"
          OFFICIAL="$(ls official/NetProxy_*.zip | head -1)"
          BASE="$(basename "$OFFICIAL")"
          # 文件名沿用官方的，在 NetProxy_ 后面加 notelemetry_（正式版和每夜版一样）
          # NetProxy_v8.7.0_1100.zip -> NetProxy_notelemetry_v8.7.0_1100.zip
          # NetProxy_v8.7.0_1101.zip -> NetProxy_notelemetry_v8.7.0_1101.zip
          OUT="NetProxy_notelemetry_${BASE#NetProxy_}"
          python3 - "$OFFICIAL" "$RUNNER_TEMP/netproxyctl" "$OUT" <<'PY'
          import sys, zipfile
          from pkg import read_entry
          src, newbin, dst = sys.argv[1:4]

          def strip_lock(data):
              # 去掉安装脚本里为统计创建的锁文件（统计代码已删除，没有人再用它）
              lines = data.decode('utf-8').split('\n')
              drop = ('exec 3>/dev/netproxy/telemetry.lock.flock', 'flock -n 3 3>&3 || exit 1')
              kept = [l for l in lines if l.strip() not in drop]
              if len(lines) - len(kept) != 2:
                  print('::warning::customize.sh 里没找到统计锁的两行，保持原样')
                  return data
              return '\n'.join(kept).encode('utf-8')

          zin = zipfile.ZipFile(src); found = False
          with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as zout:
              for i in zin.infolist():
                  if i.is_dir(): continue
                  n = i.filename
                  if n == 'bin/netproxyctl':
                      data = open(newbin, 'rb').read(); found = True
                  elif n == 'customize.sh':
                      data = strip_lock(read_entry(src, n))
                  else:
                      data = read_entry(src, n)
                  zi = zipfile.ZipInfo(n, i.date_time); zi.compress_type = zipfile.ZIP_DEFLATED
                  exe = n.startswith('bin/') or n.endswith('.sh') or n in ('netproxyctl', 'META-INF/com/google/android/update-binary')
                  zi.external_attr = (0o755 if exe else 0o644) << 16
                  zout.writestr(zi, data)
          if not found: raise SystemExit('官方 zip 里没有 bin/netproxyctl')
          PY
          sha256sum "$OUT"

          # 发布说明：去统计说明 + 官方更新日志
          {
            echo "基于官方 ${{ steps.up.outputs.tag }}，源码提交 ${{ steps.commit.outputs.sha }}。"
            echo "仅替换 bin/netproxyctl，编译时未注入统计凭据。"
            echo
            echo "---"
            echo
            echo "## 官方更新日志"
            echo
            if [ -s official_notes.md ]; then cat official_notes.md; else echo "（官方未提供更新日志）"; fi
          } > notes.md

          # 同名 release 已存在（每夜版有新提交 / 强制重建）：先删掉再建，tag 一并重建
          gh release delete "$REL" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          # 标题沿用官方 release 的标题，后面加（去统计）；官方没写标题就用 tag
          TITLE="$(cat official_title.txt 2>/dev/null || true)"
          [ -n "$TITLE" ] || TITLE="${{ steps.up.outputs.tag }}"

          # 列表顺序：GitHub 按 tag 所指提交的日期排序。直接建 tag 会指向本仓库最新提交，
          # 谁最后构建谁排最前，旧版本会插到新版本上面。这里改成：造一个提交，日期取
          # 官方 release 的发布时间（每夜版取当前时间，始终排在最前），再让 tag 指向它
          DATE="$(cat official_date.txt 2>/dev/null || true)"
          if [ "${{ matrix.channel }}" = nightly ] || [ -z "$DATE" ]; then
            DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          BRANCH="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          BASE="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)"
          TREE="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$BASE" --jq .tree.sha)"
          WHO="github-actions[bot]"; MAIL="41898282+github-actions[bot]@users.noreply.github.com"
          COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            -f message="NetProxy ${REL}" -f tree="$TREE" -f "parents[]=$BASE" \
            -f "author[name]=$WHO" -f "author[email]=$MAIL" -f "author[date]=$DATE" \
            -f "committer[name]=$WHO" -f "committer[email]=$MAIL" -f "committer[date]=$DATE" \
            --jq .sha)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$REL" >/dev/null 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$REL" -f sha="$COMMIT" >/dev/null
          echo "tag $REL -> $COMMIT（日期 $DATE）"

          EXTRA=""
          [ "${{ matrix.channel }}" = nightly ] && EXTRA="--prerelease"
          # 手动指定的版本可能比最新版旧，不能把它标成 Latest
          [ -n "${{ inputs.tag }}" ] && EXTRA="$EXTRA --latest=false"
          gh release create "$REL" "$OUT" --repo "$GITHUB_REPOSITORY" $EXTRA \
            --title "${TITLE}（去统计）" \
            --notes-file notes.md
