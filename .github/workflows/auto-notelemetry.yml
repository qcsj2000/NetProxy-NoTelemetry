name: auto-notelemetry
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 重新构建已处理过的版本（会先删除同名 release）
        type: boolean
        default: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    steps:
      - name: 查找官方最新包
        id: up
        run: |
          tag=""
          for repo in Fanju6/NetProxy-Releases Fanju6/NetProxy-Magisk; do
            if [ "${{ matrix.channel }}" = nightly ]; then
              t=nightly
            else
              t=$(gh release list --repo "$repo" --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            fi
            [ -n "$t" ] || continue
            if gh release download "$t" --repo "$repo" --pattern 'NetProxy_*.zip' --dir official 2>/dev/null; then
              tag="$t"
              # 顺便取官方 release 的更新日志，发布时附上
              # 优先取 NetProxy-Magisk 的说明（更新日志写在那边），取不到再用下载包的仓库
              for r in Fanju6/NetProxy-Magisk "$repo"; do
                gh release view "$t" --repo "$r" --json body -q .body > official_notes.md 2>/dev/null || true
                [ -s official_notes.md ] && break
              done
              break
            fi
          done
          [ -n "$tag" ] || { echo "没找到官方 zip"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 从官方包里读出源码提交号
        id: commit
        run: |
          cat > pkg.py <<'PY'
          import zipfile, struct, lzma
          def read_entry(path, name):
              z = zipfile.ZipFile(path); fh = open(path, 'rb')
              i = z.getinfo(name)
              if i.compress_type in (0, 8): return z.read(i)
              if i.compress_type == 95:
                  fh.seek(i.header_offset); h = fh.read(30)
                  n, e = struct.unpack('<HH', h[26:30])
                  fh.seek(i.header_offset + 30 + n + e)
                  return lzma.decompress(fh.read(i.compress_size))
              raise SystemExit('不支持的压缩方式 %d' % i.compress_type)
          PY
          python3 - <<'PY'
          import re, glob, io, zipfile
          from pkg import read_entry
          official = glob.glob('official/NetProxy_*.zip')[0]
          apk = zipfile.ZipFile(io.BytesIO(read_entry(official, 'NetProxy.apk')))
          manifest = apk.read('AndroidManifest.xml')
          m = re.search(rb'ci\.([0-9a-f]{7,40})', manifest) or re.search(rb'c\x00i\x00\.\x00((?:[0-9a-f]\x00){7,40})', manifest)
          if not m: raise SystemExit('官方 APK 的 versionName 里没有提交号')
          sha = m.group(1).replace(b'\x00', b'').decode()
          open('commit.txt', 'w').write(sha)
          print('源码提交:', sha)
          PY
          echo "sha=$(cat commit.txt)" >> "$GITHUB_OUTPUT"

      - name: 判断是否已处理
        id: chk
        run: |
          if [ "${{ matrix.channel }}" = nightly ]; then
            sha="${{ steps.commit.outputs.sha }}"
            name="nightly-${sha:0:7}"
          else
            name="${{ steps.up.outputs.tag }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if gh release view "nt-$name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ inputs.force }}" = true ]; then
              gh release delete "nt-$name" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "强制重建 $name"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "已经处理过 $name"
            fi
          fi

      - name: 下载对应源码
        if: steps.chk.outputs.skip != 'true'
        run: |
          mkdir upstream
          curl -fL --retry 5 -o src.tgz "https://codeload.github.com/Fanju6/NetProxy-Magisk/tar.gz/${{ steps.commit.outputs.sha }}"
          tar -xzf src.tgz -C upstream --strip-components=1

      - uses: actions/setup-go@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          go-version-file: upstream/src/native/netproxy/go.mod

      - name: 编译（不注入统计凭据）
        if: steps.chk.outputs.skip != 'true'
        working-directory: upstream/src/native/netproxy
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          if grep -rnIE "phc_[A-Za-z0-9]{20,}" ../../.. | grep -v _test.go; then
            echo "源码里有写死的 key，需要改用方案 B"; exit 1
          fi
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/netproxyctl" ./cmd/netproxyctl \
            || GOEXPERIMENT=jsonv2 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/netproxyctl" ./cmd/netproxyctl
          if grep -a -q -i -E "posthog|phc_[A-Za-z0-9]{20,}" "$RUNNER_TEMP/netproxyctl"; then
            echo "产物里仍有统计地址或 key"; exit 1
          fi

      - name: 替换并发布
        if: steps.chk.outputs.skip != 'true'
        run: |
          NAME="${{ steps.chk.outputs.name }}"
          OUT="NetProxy_notelemetry_${NAME}.zip"
          python3 - "$(ls official/NetProxy_*.zip | head -1)" "$RUNNER_TEMP/netproxyctl" "$OUT" <<'PY'
          import sys, re, zipfile
          from pkg import read_entry
          src, newbin, dst = sys.argv[1:4]
          SUFFIX = '_notelemetry'

          def rename_module(data):
              text = data.decode('utf-8')
              def repl(m):
                  old = m.group(2)
                  new = old if old.endswith(SUFFIX) else old + SUFFIX
                  return m.group(1) + new + m.group(3)
              text, c = re.subn(r'(?m)^(name=)(.*?)(\r?)$', repl, text, count=1)
              if not c: raise SystemExit('module.prop 里没有 name=')
              print('module.prop:', re.search(r'(?m)^name=.*$', text).group(0))
              return text.encode('utf-8')

          zin = zipfile.ZipFile(src); found = False; renamed = False
          with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as zout:
              for i in zin.infolist():
                  if i.is_dir(): continue
                  n = i.filename
                  if n == 'bin/netproxyctl':
                      data = open(newbin, 'rb').read(); found = True
                  elif n == 'module.prop':
                      data = rename_module(read_entry(src, n)); renamed = True
                  else:
                      data = read_entry(src, n)
                  zi = zipfile.ZipInfo(n, i.date_time); zi.compress_type = zipfile.ZIP_DEFLATED
                  exe = n.startswith('bin/') or n.endswith('.sh') or n in ('netproxyctl', 'META-INF/com/google/android/update-binary')
                  zi.external_attr = (0o755 if exe else 0o644) << 16
                  zout.writestr(zi, data)
          if not found: raise SystemExit('官方 zip 里没有 bin/netproxyctl')
          if not renamed: raise SystemExit('官方 zip 里没有 module.prop')
          PY
          sha256sum "$OUT"

          # 发布说明：去统计说明 + 官方更新日志
          {
            echo "基于官方 ${{ steps.up.outputs.tag }}，源码提交 ${{ steps.commit.outputs.sha }}。"
            echo "仅替换 bin/netproxyctl，模块名称加后缀 _notelemetry，编译时未注入统计凭据。"
            echo
            echo "---"
            echo
            echo "## 官方更新日志"
            echo
            if [ -s official_notes.md ]; then cat official_notes.md; else echo "（官方未提供更新日志）"; fi
          } > notes.md

          EXTRA=""
          [ "${{ matrix.channel }}" = nightly ] && EXTRA="--prerelease"
          gh release create "nt-${NAME}" "$OUT" --repo "$GITHUB_REPOSITORY" $EXTRA \
            --title "NetProxy ${NAME}（去统计）" \
            --notes-file notes.md

      - name: 清理旧的 nightly（保留最近 3 个）
        if: matrix.channel == 'nightly'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q 'map(select(.tagName|startswith("nt-nightly-")))|sort_by(.createdAt)|reverse|.[3:]|.[].tagName' \
            | while read -r t; do
                [ -n "$t" ] && gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
